name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Cancel in-progress runs as we always want the
# latest deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build job ──────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true   # Runs `bundle install` and caches installed gems

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Sync inventory from Google Sheets to _data/*.yml
        run: ruby scripts/sync_inventory_to_yaml.rb

      - name: Build with Jekyll 4.3+
        # The base path is injected by configure-pages so relative links work
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  # ── Deploy job ─────────────────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
