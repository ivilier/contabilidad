name: Sync Google Sheets Inventory to _data YAML

on:
  schedule:
    - cron: "0 */6 * * *" # Se ejecuta automáticamente cada 6 horas
  workflow_dispatch:      # Permite ejecutarlo manualmente con 1 clic en GitHub Actions
  repository_dispatch:
    types: [sync-inventory]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run Inventory Sync Script
        run: ruby scripts/sync_inventory_to_yaml.rb

      - name: Commit and push changes if _data has been updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/
          if git diff --staged --quiet; then
            echo "No hay cambios pendientes en _data/."
          else
            git commit -m "chore(inventory): auto-sync _data/*.yml from Google Sheets"
            git push
          fi
