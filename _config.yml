# ── Site identity ─────────────────────────────────────────────────────────────
title: "ivilier Joyería"
description: "Joyería con estilo — aretes, dijes y anillos. Piezas únicas para cada ocasión."
baseurl: ""
url: "https://catalogo.ivilier.com"

# ── Build settings ────────────────────────────────────────────────────────────
markdown: kramdown
lang: es
timezone: America/Mexico_City

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-sitemap

# ── Permalink style ───────────────────────────────────────────────────────────
permalink: pretty

# ── Exclude from build output ─────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - prompt.md
  - _docs/
  - .github/
  - .gitignore
  - vendor/
  - node_modules/
  - "*.sh"
